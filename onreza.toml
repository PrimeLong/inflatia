#:schema https://raw.githubusercontent.com/onreza/nrz-cli/main/onreza.schema.json
# ПРОЕКТ ONREZA (docs/onreza.md). [project] id/name/workspace допишет `nrz link` при привязке.

[build]
command = "npm run build:onreza"
output_dirs = [".onreza-out"]

[env.declarations]
KV_REST_API_URL = "sensitive"
KV_REST_API_TOKEN = "sensitive"
OWNER_LOGINS = { visibility = "plain", required = false }
RESEARCH_STATUS = { visibility = "plain", required = false }
RESEARCH_KV_REST_API_URL = { visibility = "sensitive", required = false }
RESEARCH_KV_REST_API_TOKEN = { visibility = "sensitive", required = false }
RESEARCH_EXPORT_TOKEN = { visibility = "sensitive", required = false }
RESEARCH_ALLOC_SEED = { visibility = "sensitive", required = false }
